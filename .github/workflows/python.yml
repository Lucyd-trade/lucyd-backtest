name: Python

# Wheels for Linux, macOS and Windows on every push; a `py-v<version>` tag also publishes them
# to PyPI (trusted publishing: the PyPI project trusts this workflow, environment `pypi`).

on:
  push:
    branches: [main]
    tags: ["py-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, test: true, live: "1" }
          - { os: ubuntu-latest, target: aarch64, test: false }
          - { os: macos-14, target: aarch64, test: true }
          - { os: macos-14, target: x86_64, test: false }
          - { os: windows-latest, target: x64, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --manifest-path python/Cargo.toml
      - name: Test the wheel
        if: matrix.test
        shell: bash
        env:
          LUCYD_LIVE: ${{ matrix.live }}
        run: |
          pip install dist/*.whl pytest
          pytest python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
